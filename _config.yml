title: Dr. Feng Guo
description: "Research in X | Y | Z"
# Replace YOUR-USERNAME with your GitHub username (no <>)
url: "https://FengGuo-IOPsyc.github.io"
baseurl: ""

# Timezone helps with post dates
timezone: America/New_York

# Minimal Mistakes via remote_theme (works on GitHub Pages)
remote_theme: "mmistakes/minimal-mistakes"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Navigation
collections:
  people:
    output: true
    permalink: /people/:name/
  publications:
    output: true
    permalink: /publications/:name/
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: false
      read_time: false
  - scope:
      path: ""
      type: "people"
    values:
      layout: "single"
      author_profile: false
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: false
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "single"
      author_profile: false

# Minimal Mistakes settings
name: "Your Lab Name"
logo: "/assets/img/logo.png"
author:
  name: "Your Name"
  avatar: "/assets/img/logo.png"
  bio: "PI, Your Lab — Research in X / Y / Z."
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:feng-guo@utc.com"
    - label: "Google Scholar"
      icon: "ai ai-google-scholar"
      url: "https://scholar.google.com/citations?user=gO4QNdgAAAAJ&hl=en"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/FengGuo-IOPsyc"

# Footer social links
footer:
  links:
    - label: "Twitter/X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://twitter.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com"

# Show excerpts on archive pages
excerpt_separator: "<!--more-->"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
permalink: /:categories/:title/
include: ["_pages", ".well-known"]
exclude:
  - "node_modules"
  - "vendor"
  - "README.md"
  - "Gemfile.lock"
  - ".github"
